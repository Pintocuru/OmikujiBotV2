<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="http://localhost:11180/templates/custom/ZZZ_OmikujiBot/omikujiData.js"></script>

    <!-- おみくじデータ -->
    <script src="./omikujiData.js"></script>
  </head>
  <body>
    <div id="App"></div>
    <script>
      window.OMIKUJI_MODE_OVERRIDE = 'dev'

      function onLoaderReady() {
        OmikujiLoader.run({
          cssFiles: ['common.css', 'ConfigMaker.css'],
          jsFiles: ['common.js', 'vendors.js', 'ConfigMaker.js'],
          requireOneComme: false,
          mountFn() {
            if (window.OmikujiBot?.mountConfigMaker) {
              window.OmikujiBot.mountConfigMaker()
            } else {
              console.error('mountConfigMaker が見つかりません')
            }
          },
        })
      }
    </script>
    <!-- 関数定義の後に script.js を読む -->
    <script src="http://localhost:11180/templates/custom/ZZZ_OmikujiBot/script.js" onload="onLoaderReady()"></script>
  </body>
</html>
